[layout]
default = "floating"
force_ssd = true
gaps_outer = 0
gaps_inner = 0

[blur]
enabled = true
radius = 10
passes = 8

[opacity]
enabled = false
value = 1.0
focus_sensitive = false
focused = 1.0
unfocused = 1.0

[workspace_transition]
enabled = true
rate = 4.0

[keybinds]
focus_workspace_1 = "y"
focus_workspace_2 = "x"

[struts]
top = 0
bottom = 0
left = 0
right = 0
