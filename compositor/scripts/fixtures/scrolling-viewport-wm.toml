[layout]
default = "scrolling"
gaps_outer = 0
gaps_inner = 12
border_width = 4
border_focused = 0xFF00D9FF
border_normal = 0xFF424852

[layout.options.scrolling]
column_fraction = 0.5
center_focused = true
follow_new_windows = true
focus_follows_mouse_delay_ms = 150

[struts]
top = 0
bottom = 0
left = 0
right = 0

[input]
focus_follows_mouse = true
focus_new_windows = true

[keybinds]
focus_left = "Super+H"
focus_right = "Super+L"
