[layout]
default = "stacking"
gaps_outer = 0
gaps_inner = 0
snap_layout = "work"

[layout.slots]
primary = "floating"
secondary = "tile"

[layout.options.stacking]
placement = "cascade"
move_step = 10
snap_gap = 0
snap_threshold = 24
resistance = 12

[layout.snap-layout.work]
name = "Work"
padding = 8

[layout.snap-layout.work.zone.left]
x = 0.0
y = 0.0
width = 0.5
height = 1.0

[layout.snap-layout.work.zone.right]
x = 0.5
y = 0.0
width = 0.5
height = 1.0

[struts]
top = 0
bottom = 0
left = 0
right = 0

[workspace_transition]
enabled = false

[input]
focus_follows_mouse = false

[keybinds]
set_layout_primary = "Super+F"
set_layout_secondary = "Super+T"
toggle_floating = "Super+V"
nudge_floating_right = "Super+Ctrl+D"
snap_left = "Super+Ctrl+H"
unsnap = "Super+Ctrl+U"

[keybinds.custom]
"Super+Ctrl+J" = "builtin:snap_zone:work/right"
