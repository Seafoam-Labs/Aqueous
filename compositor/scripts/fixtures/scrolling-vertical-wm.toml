[layout]
default = "game-mode"
gaps_outer = 0
gaps_inner = 0
border_width = 0

[layout.options.scrolling]
column_fraction = 0.5
center_focused = true
follow_new_windows = true
prefer_vertical_on_portrait = true

[struts]
top = 0
bottom = 0
left = 0
right = 0

[input]
focus_follows_mouse = false

[keybinds]
focus_up = "Super+K"
move_window_right = "Super+Shift+N"
scroll_viewport_down = "Super+V"
