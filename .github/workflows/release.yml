name: Release

# Build the single Aqueous compositor/policy executable and attach it to a
# GitHub Release. Runs inside an Arch Linux container
# so we inherit Arch's patched `wayland-protocols` (which carries
# `wp_color_manager_v1` v2) — Ubuntu/upstream tarballs do not have it yet.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.1.0). Created if missing.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Refresh pacman and install base tools (incl. nodejs for Actions)
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl tar xz nodejs \
            clang llvm lld \
            wayland wayland-protocols wayland-utils \
            libxkbcommon libinput \
            pixman libdrm libevdev \
            mesa libglvnd systemd-libs seatd \
            libdecor \
            pkgconf ninja meson \
            wlroots0.20 \
            libdisplay-info libliftoff lcms2 vulkan-icd-loader \
            xcb-util-errors xcb-util-renderutil xcb-util-wm \
            xorg-xwayland

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify wayland-protocols carries wp_color_manager_v1 v2
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Q wayland-protocols
          grep -E 'name="wp_color_manager_v1" version="2"' \
            /usr/share/wayland-protocols/staging/color-management/color-management-v1.xml

      - name: Verify wlroots 0.20 is installed
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Q wlroots0.20
          ls -l /usr/lib/libwlroots-0.20.so* || true
          pkg-config --modversion wlroots-0.20 || true

      - name: Build Aqueous compositor
        shell: bash
        run: |
          cd compositor
          zig build -Doptimize=ReleaseSafe -Dxwayland -Dllvm \
            --prefix "$GITHUB_WORKSPACE/publish/aqueous-compositor" install

      - name: Stage bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p publish/aqueous-linux-x64/bin
          mkdir -p publish/aqueous-linux-x64/share/wayland-sessions
          mkdir -p publish/aqueous-linux-x64/share/aqueous
          mkdir -p publish/aqueous-linux-x64/lib/systemd/user
          mkdir -p publish/aqueous-linux-x64/lib/udev/rules.d
          mkdir -p publish/aqueous-linux-x64/lib/tmpfiles.d
          mkdir -p publish/aqueous-linux-x64/etc/xdg/aqueous
          mkdir -p publish/aqueous-linux-x64/etc/uwsm
          mkdir -p publish/aqueous-linux-x64/share/xdg-desktop-portal

          # Binaries
          cp publish/aqueous-compositor/bin/aqueous publish/aqueous-linux-x64/bin/

          # Compositor share data (man pages and protocol ABI metadata) if present
          if [ -d publish/aqueous-compositor/share ]; then
            cp -r publish/aqueous-compositor/share/. publish/aqueous-linux-x64/share/
          fi

          # Packaging scripts / config / units
          cp packaging/aqueous-init   publish/aqueous-linux-x64/bin/
          cp packaging/aqueous-wm.sh  publish/aqueous-linux-x64/bin/aqueous-wm
          chmod +x publish/aqueous-linux-x64/bin/aqueous-init publish/aqueous-linux-x64/bin/aqueous-wm
          cp aqueous.desktop publish/aqueous-linux-x64/share/wayland-sessions/
          cp wm.toml         publish/aqueous-linux-x64/etc/xdg/aqueous/
          cp wm.toml         publish/aqueous-linux-x64/share/aqueous/
          cp packaging/uwsm/env-aqueous publish/aqueous-linux-x64/etc/uwsm/
          cp packaging/aqueous-portals.conf \
             publish/aqueous-linux-x64/share/xdg-desktop-portal/aqueous-portals.conf
          cp packaging/aqueous.tmpfiles publish/aqueous-linux-x64/lib/tmpfiles.d/aqueous.conf
          cp packaging/aqueous-session.target publish/aqueous-linux-x64/lib/systemd/user/
          # Noctalia shell unit + its graphical-session.target.wants symlink, so a
          # tarball/binary install also brings up the SNI tray watcher before the
          # autostart target (mirrors PKGBUILD package()).
          cp packaging/noctalia.service publish/aqueous-linux-x64/lib/systemd/user/
          cp packaging/xwayland-satellite.service publish/aqueous-linux-x64/lib/systemd/user/
          mkdir -p publish/aqueous-linux-x64/lib/systemd/user/graphical-session.target.wants
          ln -sf ../noctalia.service \
             publish/aqueous-linux-x64/lib/systemd/user/graphical-session.target.wants/noctalia.service
          ln -sf ../xwayland-satellite.service \
             publish/aqueous-linux-x64/lib/systemd/user/graphical-session.target.wants/xwayland-satellite.service
          cp packaging/udev/70-aqueous-uaccess.rules \
             publish/aqueous-linux-x64/lib/udev/rules.d/ 2>/dev/null || true

          # Noctalia (v5) default config asset
          if [ -d packaging/noctalia ]; then
            mkdir -p publish/aqueous-linux-x64/share/aqueous/noctalia
            cp packaging/noctalia/*.toml publish/aqueous-linux-x64/share/aqueous/noctalia/ 2>/dev/null || true
          fi
          if [ -d packaging/wallpapers ]; then
            mkdir -p publish/aqueous-linux-x64/share/aqueous/wallpapers
            cp packaging/wallpapers/*.avif publish/aqueous-linux-x64/share/aqueous/wallpapers/ 2>/dev/null || true
          fi

          # Strip debug symbols
          find publish/aqueous-linux-x64 -type f \( -name '*.dbg' -o -name '*.pdb' \) -delete

      - name: Create tarballs
        shell: bash
        run: |
          set -euxo pipefail
          cd publish
          tar -czf Aqueous-linux-x64.tar.gz -C aqueous-linux-x64 .
          tar -czf Aqueous-Compositor-linux-x64.tar.gz  -C aqueous-compositor .

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd publish
          sha256sum \
            Aqueous-linux-x64.tar.gz \
            Aqueous-Compositor-linux-x64.tar.gz \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqueous-release
          path: |
            publish/Aqueous-linux-x64.tar.gz
            publish/Aqueous-Compositor-linux-x64.tar.gz
            publish/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            publish/Aqueous-linux-x64.tar.gz
            publish/Aqueous-Compositor-linux-x64.tar.gz
            publish/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
