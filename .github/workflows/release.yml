name: Release

# Build compilation outputs (Aqueous .NET binaries + RiverDelta compositor)
# and attach them to a GitHub Release. Runs inside an Arch Linux container
# so we inherit Arch's patched `wayland-protocols` (which carries
# `wp_color_manager_v1` v2) — Ubuntu/upstream tarballs do not have it yet.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.1.0). Created if missing.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Refresh pacman and install base tools (incl. nodejs for Actions)
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl tar xz nodejs \
            clang llvm lld zlib icu \
            wayland wayland-protocols wayland-utils \
            libxkbcommon libinput \
            pixman libdrm libevdev \
            mesa libglvnd systemd-libs seatd \
            libdecor \
            pkgconf ninja meson

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify wayland-protocols carries wp_color_manager_v1 v2
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Q wayland-protocols
          grep -E 'name="wp_color_manager_v1" version="2"' \
            /usr/share/wayland-protocols/staging/color-management/color-management-v1.xml

      - name: Publish Aqueous (WM)
        shell: bash
        run: |
          dotnet publish Aqueous/Aqueous.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishAot=true \
            -o publish/Aqueous

      - name: Publish Aqueous.InputDaemon
        shell: bash
        run: |
          dotnet publish Aqueous.InputDaemon/Aqueous.InputDaemon.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishAot=true \
            -o publish/Aqueous.InputDaemon

      - name: Publish Aqueous.OutputDaemon
        shell: bash
        run: |
          dotnet publish Aqueous.OutputDaemon/Aqueous.OutputDaemon.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishAot=true \
            -o publish/Aqueous.OutputDaemon

      - name: Build RiverDelta (compositor)
        shell: bash
        run: |
          cd compositor
          zig build -Doptimize=ReleaseSafe -Dxwayland -Dllvm \
            --prefix "$GITHUB_WORKSPACE/publish/riverdelta" install

      - name: Stage bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p publish/aqueous-linux-x64/bin
          mkdir -p publish/aqueous-linux-x64/share/wayland-sessions
          mkdir -p publish/aqueous-linux-x64/share/aqueous
          mkdir -p publish/aqueous-linux-x64/lib/systemd/user
          mkdir -p publish/aqueous-linux-x64/lib/udev/rules.d
          mkdir -p publish/aqueous-linux-x64/etc/xdg/aqueous

          # Binaries
          cp publish/Aqueous/aqueous                       publish/aqueous-linux-x64/bin/
          cp publish/Aqueous.InputDaemon/aqueous-inputd    publish/aqueous-linux-x64/bin/
          cp publish/Aqueous.OutputDaemon/aqueous-outputd  publish/aqueous-linux-x64/bin/
          cp publish/riverdelta/bin/riverdelta             publish/aqueous-linux-x64/bin/

          # RiverDelta share data (man pages, etc.) if present
          if [ -d publish/riverdelta/share ]; then
            cp -r publish/riverdelta/share/. publish/aqueous-linux-x64/share/
          fi

          # Packaging scripts / config / units
          cp packaging/aqueous-init   publish/aqueous-linux-x64/bin/
          cp packaging/aqueous-wm.sh  publish/aqueous-linux-x64/bin/aqueous-wm
          chmod +x publish/aqueous-linux-x64/bin/aqueous-init publish/aqueous-linux-x64/bin/aqueous-wm
          cp aqueous.desktop publish/aqueous-linux-x64/share/wayland-sessions/
          cp wm.toml         publish/aqueous-linux-x64/etc/xdg/aqueous/
          cp wm.toml         publish/aqueous-linux-x64/share/aqueous/
          cp packaging/aqueous-inputd.service  publish/aqueous-linux-x64/lib/systemd/user/ 2>/dev/null || true
          cp packaging/aqueous-inputd.socket   publish/aqueous-linux-x64/lib/systemd/user/ 2>/dev/null || true
          cp packaging/aqueous-outputd.service publish/aqueous-linux-x64/lib/systemd/user/ 2>/dev/null || true
          cp packaging/udev/70-aqueous-uaccess.rules \
             publish/aqueous-linux-x64/lib/udev/rules.d/ 2>/dev/null || true

          # Quickshell / Noctalia integration assets
          if [ -d packaging/quickshell ]; then
            mkdir -p publish/aqueous-linux-x64/share/aqueous/quickshell
            cp packaging/quickshell/*.qml publish/aqueous-linux-x64/share/aqueous/quickshell/ 2>/dev/null || true
          fi
          if [ -d packaging/noctalia ]; then
            mkdir -p publish/aqueous-linux-x64/share/aqueous/noctalia
            cp packaging/noctalia/*.json publish/aqueous-linux-x64/share/aqueous/noctalia/ 2>/dev/null || true
          fi
          if [ -d packaging/wallpapers ]; then
            mkdir -p publish/aqueous-linux-x64/share/aqueous/wallpapers
            cp packaging/wallpapers/*.avif publish/aqueous-linux-x64/share/aqueous/wallpapers/ 2>/dev/null || true
          fi

          # Strip debug symbols
          find publish/aqueous-linux-x64 -type f \( -name '*.dbg' -o -name '*.pdb' \) -delete

      - name: Create tarballs
        shell: bash
        run: |
          set -euxo pipefail
          cd publish
          tar -czf Aqueous-linux-x64.tar.gz -C aqueous-linux-x64 .
          tar -czf Aqueous-WM-linux-x64.tar.gz          -C Aqueous .
          tar -czf Aqueous-InputDaemon-linux-x64.tar.gz -C Aqueous.InputDaemon .
          tar -czf Aqueous-OutputDaemon-linux-x64.tar.gz -C Aqueous.OutputDaemon .
          tar -czf RiverDelta-linux-x64.tar.gz          -C riverdelta .

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd publish
          sha256sum \
            Aqueous-linux-x64.tar.gz \
            Aqueous-WM-linux-x64.tar.gz \
            Aqueous-InputDaemon-linux-x64.tar.gz \
            Aqueous-OutputDaemon-linux-x64.tar.gz \
            RiverDelta-linux-x64.tar.gz \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqueous-release
          path: |
            publish/Aqueous-linux-x64.tar.gz
            publish/Aqueous-WM-linux-x64.tar.gz
            publish/Aqueous-InputDaemon-linux-x64.tar.gz
            publish/Aqueous-OutputDaemon-linux-x64.tar.gz
            publish/RiverDelta-linux-x64.tar.gz
            publish/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            publish/Aqueous-linux-x64.tar.gz
            publish/Aqueous-WM-linux-x64.tar.gz
            publish/Aqueous-InputDaemon-linux-x64.tar.gz
            publish/Aqueous-OutputDaemon-linux-x64.tar.gz
            publish/RiverDelta-linux-x64.tar.gz
            publish/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
