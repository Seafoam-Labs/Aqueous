name: Release

# Build Aqueous and its inspection client and attach them to a
# GitHub Release. Runs inside an Arch Linux container so the build has
# wayland-protocols 1.49 and the `wp_color_manager_v1` version 3 contract.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.1.0). Created if missing.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Refresh pacman and install base tools (incl. nodejs for Actions)
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl patch tar xz nodejs python jq libarchive \
            clang llvm lld \
            wayland wayland-protocols wayland-utils \
            libxkbcommon libinput \
            pixman libdrm libevdev \
            mesa libglvnd systemd-libs seatd pipewire libinih \
            libdecor gtk4 \
            pkgconf ninja meson scdoc \
            wlroots0.20 \
            libdisplay-info libliftoff lcms2 \
            glslang shaderc vulkan-headers vulkan-icd-loader freetype2 \
            xcb-util-errors xcb-util-renderutil xcb-util-wm \
            xorg-xwayland

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify wayland-protocols carries wp_color_manager_v1 v3
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Q wayland-protocols
          pkg-config --atleast-version=1.49 wayland-protocols
          grep -E 'name="wp_color_manager_v1" version="3"' \
            /usr/share/wayland-protocols/staging/color-management/color-management-v1.xml

      - name: Verify wlroots 0.20 is installed
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Q wlroots0.20
          ls -l /usr/lib/libwlroots-0.20.so* || true
          pkg-config --modversion wlroots-0.20 || true

      - name: Build Aqueous compositor
        shell: bash
        run: |
          compositor/scripts/build-wlroots-render-hook.sh \
            "$GITHUB_WORKSPACE/.deps/wlroots-render-hook"
          AQUEOUS_WLROOTS_PREFIX="$GITHUB_WORKSPACE/.deps/wlroots-render-hook" \
            compositor/scripts/test-color-management-luminance.sh
          AQUEOUS_WLROOTS_PREFIX="$GITHUB_WORKSPACE/.deps/wlroots-render-hook" \
            compositor/scripts/test-ext-capture-formats.sh
          cd compositor
          rm -rf -- "$GITHUB_WORKSPACE/publish/aqueous-compositor/share/aqueous-protocols"
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.deps/wlroots-render-hook/lib/pkgconfig" \
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          zig build -Doptimize=ReleaseSafe -Dxwayland -Dllvm -Dman-pages=true -Dversion-string="${tag#v}" \
            --prefix "$GITHUB_WORKSPACE/publish/aqueous-compositor" install
          cmp "$GITHUB_WORKSPACE/.deps/wlroots-render-hook/lib/libwlroots-0.20.so" \
            "$GITHUB_WORKSPACE/publish/aqueous-compositor/lib/aqueous/libwlroots-0.20.so"
          readelf -d "$GITHUB_WORKSPACE/publish/aqueous-compositor/bin/aqueous" |
            grep -F '$ORIGIN/../lib/aqueous'
          if readelf -d "$GITHUB_WORKSPACE/publish/aqueous-compositor/bin/aqueous" |
              grep -qi 'scenefx'; then
            exit 1
          fi

      - name: Build bundled Aqueous portal backend
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --silent --show-error \
            https://github.com/emersion/xdg-desktop-portal-wlr/archive/refs/tags/v0.8.4.tar.gz \
            -o /tmp/xdg-desktop-portal-wlr-0.8.4.tar.gz
          echo '3122966d46ab108f505525bcb2498f9121b446ee8438fbfceb73a7a1fa1ad400  /tmp/xdg-desktop-portal-wlr-0.8.4.tar.gz' | \
            sha256sum --check -
          tar -xzf /tmp/xdg-desktop-portal-wlr-0.8.4.tar.gz -C /tmp
          patch --fuzz=0 -d /tmp/xdg-desktop-portal-wlr-0.8.4 -Np1 < \
            packaging/portal/0001-rename-backend-for-aqueous.patch
          sh packaging/portal/build-aqueous-portal.sh \
            /tmp/xdg-desktop-portal-wlr-0.8.4 \
            /tmp/aqueous-portal-build \
            "$GITHUB_WORKSPACE/publish/aqueous-portal"
          packaging/tests/test-portal-packaging.sh \
            "$GITHUB_WORKSPACE/publish/aqueous-portal/usr/lib/aqueous/xdg-desktop-portal-aqueous"

      - name: Build Welcome to Aqueous
        shell: bash
        run: |
          set -euxo pipefail
          zig build --build-file welcome/build.zig \
            -Dcpu=baseline -Doptimize=ReleaseSafe test
          zig build --build-file welcome/build.zig \
            -Dcpu=baseline -Doptimize=ReleaseSafe \
            --prefix "$GITHUB_WORKSPACE/publish/aqueous-welcome" install

      - name: Build canonical configuration helper
        shell: bash
        run: |
          zig build --build-file settingsApplication/build.zig test test-driver \
            -Dmodel-only=true -Dcpu=baseline -Doptimize=ReleaseSafe
          settingsApplication/tests/test-backend.sh
          zig build --build-file settingsApplication/build.zig \
            -Dcpu=baseline -Doptimize=ReleaseSafe \
            --prefix "$GITHUB_WORKSPACE/publish/aqueous-config"
          AQUEOUS_CONFIG_BINARY="$GITHUB_WORKSPACE/publish/aqueous-config/bin/aqueous-config" \
            AQUEOUSCTL_BINARY="$GITHUB_WORKSPACE/publish/aqueous-compositor/bin/aqueousctl" \
            settingsApplication/tests/test-packaging.sh

      - name: Build DMS chooser and publishable components
        shell: bash
        run: |
          set -euo pipefail
          zig build --build-file packaging/portal/bridge/build.zig \
            -Dcpu=baseline -Doptimize=ReleaseSafe --prefix "$GITHUB_WORKSPACE/publish/aqueous-chooser"
          export AQUEOUS_COMPOSITOR_DIST="$GITHUB_WORKSPACE/publish/aqueous-compositor"
          export AQUEOUS_CONFIG_BINARY="$GITHUB_WORKSPACE/publish/aqueous-config/bin/aqueous-config"
          export AQUEOUS_WELCOME_BINARY="$GITHUB_WORKSPACE/publish/aqueous-welcome/bin/aqueous-welcome"
          export AQUEOUS_PORTAL_BINARY="$GITHUB_WORKSPACE/publish/aqueous-portal/usr/lib/aqueous/xdg-desktop-portal-aqueous"
          export AQUEOUS_PORTAL_LICENSE=/tmp/xdg-desktop-portal-wlr-0.8.4/LICENSE
          export AQUEOUS_PORTAL_CHOOSER_BINARY="$GITHUB_WORKSPACE/publish/aqueous-chooser/bin/aqueous-dms-portal-chooser"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          bash packaging/tests/test-components.sh
          bash packaging/release-components.sh publish --version "${tag#v}" --architecture x86_64
          tar -czf publish/Aqueous-Compositor-linux-x64.tar.gz -C publish/aqueous-compositor .
          (cd publish && sha256sum Aqueous-Compositor-linux-x64.tar.gz >> SHA256SUMS.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aqueous-release
          path: |
            publish/Aqueous-*.tar.gz
            publish/SHA256SUMS.txt
            publish/PKGBUILD-bin
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            publish/Aqueous-*.tar.gz
            publish/SHA256SUMS.txt
            publish/PKGBUILD-bin
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
