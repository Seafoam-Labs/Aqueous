name: Release

# Build Aqueous and its inspection client and attach them to a
# GitHub Release. Runs inside an Arch Linux container so the build has
# wayland-protocols 1.49 and the `wp_color_manager_v1` version 3 contract.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (e.g. v0.1.0). Created if missing.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Refresh pacman and install base tools (incl. nodejs for Actions)
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl patch tar xz nodejs \
            clang llvm lld \
            wayland wayland-protocols wayland-utils \
            libxkbcommon libinput \
            pixman libdrm libevdev \
            mesa libglvnd systemd-libs seatd \
            libdecor \
            pkgconf ninja meson \
            wlroots0.20 \
            libdisplay-info libliftoff lcms2 \
            glslang shaderc vulkan-headers vulkan-icd-loader freetype2 \
            xcb-util-errors xcb-util-renderutil xcb-util-wm \
            xorg-xwayland

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify wayland-protocols carries wp_color_manager_v1 v3
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Q wayland-protocols
          pkg-config --atleast-version=1.49 wayland-protocols
          grep -E 'name="wp_color_manager_v1" version="3"' \
            /usr/share/wayland-protocols/staging/color-management/color-management-v1.xml

      - name: Verify wlroots 0.20 is installed
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Q wlroots0.20
          ls -l /usr/lib/libwlroots-0.20.so* || true
          pkg-config --modversion wlroots-0.20 || true

      - name: Build Aqueous compositor
        shell: bash
        run: |
          compositor/scripts/build-wlroots-render-hook.sh \
            "$GITHUB_WORKSPACE/.deps/wlroots-render-hook"
          AQUEOUS_WLROOTS_PREFIX="$GITHUB_WORKSPACE/.deps/wlroots-render-hook" \
            compositor/scripts/test-color-management-luminance.sh
          cd compositor
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.deps/wlroots-render-hook/lib/pkgconfig" \
          zig build -Doptimize=ReleaseSafe -Dxwayland -Dllvm \
            --prefix "$GITHUB_WORKSPACE/publish/aqueous-compositor" install
          cmp "$GITHUB_WORKSPACE/.deps/wlroots-render-hook/lib/libwlroots-0.20.so" \
            "$GITHUB_WORKSPACE/publish/aqueous-compositor/lib/aqueous/libwlroots-0.20.so"
          readelf -d "$GITHUB_WORKSPACE/publish/aqueous-compositor/bin/aqueous" |
            grep -F '$ORIGIN/../lib/aqueous'
          if readelf -d "$GITHUB_WORKSPACE/publish/aqueous-compositor/bin/aqueous" |
              grep -qi 'scenefx'; then
            exit 1
          fi

      - name: Build Aqueous Settings helper
        shell: bash
        run: |
          set -euxo pipefail
          zig build --build-file plugin/helper/build.zig \
            -Dcpu=baseline -Doptimize=ReleaseSafe \
            --prefix "$GITHUB_WORKSPACE/publish/aqueous-plugin" install

      - name: Build Welcome to Aqueous
        shell: bash
        run: |
          set -euxo pipefail
          zig build --build-file welcome/build.zig \
            -Dcpu=baseline -Doptimize=ReleaseSafe test
          zig build --build-file welcome/build.zig \
            -Dcpu=baseline -Doptimize=ReleaseSafe \
            --prefix "$GITHUB_WORKSPACE/publish/aqueous-welcome" install

      - name: Stage bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p publish/aqueous-linux-x64/bin
          mkdir -p publish/aqueous-linux-x64/share/wayland-sessions
          mkdir -p publish/aqueous-linux-x64/share/applications
          mkdir -p publish/aqueous-linux-x64/share/aqueous
          mkdir -p publish/aqueous-linux-x64/lib/systemd/user
          mkdir -p publish/aqueous-linux-x64/lib/aqueous
          mkdir -p publish/aqueous-linux-x64/lib/udev/rules.d
          mkdir -p publish/aqueous-linux-x64/lib/tmpfiles.d
          mkdir -p publish/aqueous-linux-x64/etc/xdg/aqueous
          mkdir -p publish/aqueous-linux-x64/etc/xdg/autostart
          mkdir -p publish/aqueous-linux-x64/etc/xdg/uwsm
          mkdir -p publish/aqueous-linux-x64/share/xdg-desktop-portal

          # Binaries
          cp publish/aqueous-compositor/bin/aqueous publish/aqueous-linux-x64/bin/
          cp publish/aqueous-compositor/bin/aqueousctl publish/aqueous-linux-x64/bin/
          cp publish/aqueous-plugin/bin/aqueous-config publish/aqueous-linux-x64/bin/
          cp publish/aqueous-welcome/bin/aqueous-welcome publish/aqueous-linux-x64/bin/
          cp publish/aqueous-compositor/lib/aqueous/libwlroots-0.20.so \
            publish/aqueous-linux-x64/lib/aqueous/

          # Compositor share data (man pages and protocol ABI metadata) if present
          if [ -d publish/aqueous-compositor/share ]; then
            cp -r publish/aqueous-compositor/share/. publish/aqueous-linux-x64/share/
          fi

          # Packaging scripts / config / units
          cp packaging/aqueous-init   publish/aqueous-linux-x64/bin/
          cp packaging/aqueous-wm.sh  publish/aqueous-linux-x64/bin/aqueous-wm
          chmod +x publish/aqueous-linux-x64/bin/aqueous-init publish/aqueous-linux-x64/bin/aqueous-wm
          cp aqueous.desktop publish/aqueous-linux-x64/share/wayland-sessions/
          cp packaging/aqueous-welcome.desktop \
             publish/aqueous-linux-x64/share/applications/org.aqueous.Welcome.desktop
          cp packaging/aqueous-welcome-autostart.desktop \
             publish/aqueous-linux-x64/etc/xdg/autostart/org.aqueous.Welcome.desktop
          cp wm.toml         publish/aqueous-linux-x64/etc/xdg/aqueous/
          cp wm.toml         publish/aqueous-linux-x64/share/aqueous/
          cp packaging/uwsm/env-aqueous publish/aqueous-linux-x64/etc/xdg/uwsm/
          cp packaging/aqueous-portals.conf \
             publish/aqueous-linux-x64/share/xdg-desktop-portal/aqueous-portals.conf
          cp packaging/aqueous.tmpfiles publish/aqueous-linux-x64/lib/tmpfiles.d/aqueous.conf
          cp packaging/aqueous-session.target publish/aqueous-linux-x64/lib/systemd/user/
          # Noctalia shell unit + its graphical-session.target.wants symlink, so a
          # tarball/binary install also brings up the SNI tray watcher before the
          # autostart target (mirrors PKGBUILD package()).
          cp packaging/noctalia.service publish/aqueous-linux-x64/lib/systemd/user/
          cp packaging/enable-noctalia-plugin.sh \
             publish/aqueous-linux-x64/lib/aqueous/enable-noctalia-plugin
          mkdir -p publish/aqueous-linux-x64/lib/systemd/user/graphical-session.target.wants
          ln -sf ../noctalia.service \
             publish/aqueous-linux-x64/lib/systemd/user/graphical-session.target.wants/noctalia.service
          cp packaging/udev/70-aqueous-uaccess.rules \
             publish/aqueous-linux-x64/lib/udev/rules.d/ 2>/dev/null || true

          # Noctalia (v5) default config asset
          if [ -d packaging/noctalia ]; then
            mkdir -p publish/aqueous-linux-x64/share/aqueous/noctalia
            cp packaging/noctalia/*.toml publish/aqueous-linux-x64/share/aqueous/noctalia/ 2>/dev/null || true
          fi
          mkdir -p publish/aqueous-linux-x64/share/aqueous/ghostty
          cp packaging/ghostty/config.ghostty \
             publish/aqueous-linux-x64/share/aqueous/ghostty/
          mkdir -p publish/aqueous-linux-x64/share/aqueous/noctalia-plugins/settings/translations
          cp plugin/catalog.toml \
             publish/aqueous-linux-x64/share/aqueous/noctalia-plugins/
          cp plugin/settings/plugin.toml \
             plugin/settings/widget.luau \
             plugin/settings/panel.luau \
             plugin/settings/aqueous.png \
             publish/aqueous-linux-x64/share/aqueous/noctalia-plugins/settings/
          cp plugin/settings/translations/en.json \
             publish/aqueous-linux-x64/share/aqueous/noctalia-plugins/settings/translations/
          if [ -d packaging/wallpapers ]; then
            mkdir -p publish/aqueous-linux-x64/share/aqueous/wallpapers
            cp packaging/wallpapers/*.avif publish/aqueous-linux-x64/share/aqueous/wallpapers/ 2>/dev/null || true
          fi

          # Strip debug symbols
          find publish/aqueous-linux-x64 -type f \( -name '*.dbg' -o -name '*.pdb' \) -delete

      - name: Create tarballs
        shell: bash
        run: |
          set -euxo pipefail
          cd publish
          tar -czf Aqueous-linux-x64.tar.gz -C aqueous-linux-x64 .
          tar -czf Aqueous-Compositor-linux-x64.tar.gz  -C aqueous-compositor .

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd publish
          sha256sum \
            Aqueous-linux-x64.tar.gz \
            Aqueous-Compositor-linux-x64.tar.gz \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aqueous-release
          path: |
            publish/Aqueous-linux-x64.tar.gz
            publish/Aqueous-Compositor-linux-x64.tar.gz
            publish/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            publish/Aqueous-linux-x64.tar.gz
            publish/Aqueous-Compositor-linux-x64.tar.gz
            publish/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
