# Aqueous default Noctalia (v5) config.
#
# Seeded to ~/.config/noctalia/config.toml on first launch by aqueous-init when
# the user has no Noctalia config yet. Never overwritten afterwards.
#
# Noctalia v5 reads every *.toml in ~/.config/noctalia/ and merges them; this is
# the hand-written base layer. Changes made in the Noctalia Settings GUI are
# written separately to ~/.local/state/noctalia/settings.toml and win over the
# values here. v5 ships sane defaults, so this seed stays minimal: it enables
# the packaged Aqueous Settings plugin, places its widget on the default bar,
# and sets the bundled wallpapers and idle/lock behaviour.

[bar.default]
start = [ "launcher", "wallpaper", "workspaces", "aqueous_settings" ]

[widget.aqueous_settings]
type = "aqueous/settings:widget"

[plugins]
enabled = [ "aqueous/settings" ]

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"

[[plugins.source]]
name = "aqueous"
kind = "path"
location = "/usr/share/aqueous/noctalia-plugins"

[wallpaper]
enabled   = true
fill_mode = "fit"                 # center | crop | fit | stretch | repeat | span
directory = "/usr/share/aqueous/wallpapers"

[wallpaper.automation]
enabled          = true
interval_seconds = 300            # rotate wallpaper every 5 min (v4 randomIntervalSec = 300)
order            = "random"       # random | alphabetical

[lockscreen]
enabled         = true
blurred_desktop = true            # blurred desktop snapshot behind the lock screen (v4 enableBlurBehind)

[idle.behavior.lock]
timeout = 300                     # lock after 5 min idle (v4 lockTimeout = 300)
command = "noctalia:session lock"
enabled = true

[idle.behavior.screen-off]
timeout        = 600              # DPMS off after 10 min idle (v4 screenOffTimeout = 600)
command        = "noctalia:dpms-off"
resume_command = "noctalia:dpms-on"
enabled        = true
