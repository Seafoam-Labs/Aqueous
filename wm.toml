# =============================================================================
# Aqueous WM
# Path: ~/.config/aqueous/wm.toml
# Parser is a tiny TOML subset: [section], [[output]], key = value, # comments.
# Unknown keys are ignored; a malformed file falls back to defaults silently.
# =============================================================================


# -----------------------------------------------------------------------------
# Per-output overrides. Repeat the [[output]] block once per monitor.
# `name` matches river_output_v1.name (e.g. "DP-1", "HDMI-A-1", "eDP-1").
# -----------------------------------------------------------------------------
[[output]]
name   = "DP-4"
mode   = "7680x2160@240.000000"
scale  = 1.0
position = [0,0]
enabled = true

[display]
apply_on_start  = true
apply_on_reload = true
#
#[[output]]
#name   = "HDMI-A-1"
#layout = "tile"
#
#[[output]]
#name   = "eDP-1"
#layout = "monocle"

# -----------------------------------------------------------------------------
# Per-workspace layout overrides. Each [[workspace]] block forces one workspace
# to a given layout id. Identify the workspace by its 1-based number:
#   workspace = 1   # workspace 1, 2, 3, …
# An optional `output` connector name scopes the override to one monitor; a
# block without `output` applies to that workspace on every monitor. Precedence
# at resolution time: a per-keybinding set_layout_* override (per workspace) >
# an output+workspace block > a workspace-only block > [[output]] > [layout].default.
# For a multi-tag view the lowest matching workspace number wins.
# -----------------------------------------------------------------------------
#[[workspace]]
#workspace = 1
#layout    = "tile"
#
#[[workspace]]
#output    = "DP-1"
#workspace = 2
#layout    = "monocle"
[struts]
top    = 32   # Noctalia bar height; adjust to match your bar
bottom = 0
left   = 0
right  = 0

# -----------------------------------------------------------------------------
# Backdrop blur (requires riverdelta built with SceneFX). Applied behind window
# content. Per-window exclusions (e.g. games) live in rules.toml as `blur = false`.
# -----------------------------------------------------------------------------
[blur]
enabled = false  # set true to enable compositor backdrop blur
radius  = 5      # blur radius in pixels
passes  = 3      # number of blur passes (higher = blurrier, costlier)

# Default window-content opacity (requires riverdelta with opacity support).
# Per-window overrides live in rules.toml as `opacity = 0.85`.
[opacity]
enabled         = false  # set true to apply opacity to window content
value           = 0.9    # stable opacity when focus_sensitive = false
focus_sensitive = false  # true = use focused/unfocused below per window focus
focused         = 1.0    # focused-window opacity when focus_sensitive = true
unfocused       = 0.9    # unfocused-window opacity when focus_sensitive = true


# -----------------------------------------------------------------------------
# Actions definitions.
# This is where you set actions that are attached to a keybind
# -----------------------------------------------------------------------------
[actions]
toggle_start_menu = "noctalia msg panel-toggle launcher"
spawn_terminal = "tabby"
lock_screen = "swaylock -f --screenshots --clock --indicator --effect-blur 7x5 --effect-vignette 0.5:0.5 --fade-in 0.2 --grace 2 --ring-color bb00cc --key-hover-color ee00ee --line-color 00000000 --inside-color 00000088 --separator-color 00000000"

# -----------------------------------------------------------------------------
# Keybindings.
#
# Each built-in action maps to either:
#   - a single chord string:   action = "Super+H"
#   - a list of chords:        action = ["Super+H", "Alt+Left"]
#   - an empty list to unbind: action = []
#
# Chord grammar: tokens joined by '+', case-insensitive.
#   Modifiers: Super (Mod4) | Ctrl | Alt (Mod1) | Shift
#   Keys:      single letters (A–Z), digits (0–9), F1–F24,
#              named keys (Return, Space, Tab, Comma, Period, Escape,
#              Left, Right, Up, Down, Home, End, PageUp, PageDown, ...)
#
# Omit any line to keep the compiled-in default (shown in the comment).
# -----------------------------------------------------------------------------
[keybinds]
# --- Window / session ---
toggle_start_menu     = "Super+Space"      # default
spawn_terminal        = "Super+Return"     # default
close_focused         = "Super+Q"          # default
#cycle_focus           = "Super+Tab"        # default

# --- Directional focus (works in tile/grid; scrolling = prev/next column) ---
focus_left            = "Super+H"          # default
focus_right           = "Super+L"          # default
focus_up              = "Super+K"          # default
focus_down            = "Super+J"          # default

# --- Scrolling-layout viewport pan + column move ---
scroll_viewport_left  = "Super+Comma"      # default
scroll_viewport_right = "Super+Period"     # default
move_column_left      = "Super+Shift+H"    # default
move_column_right     = "Super+Shift+L"    # default

# --- Opt-in actions (no default chord) ---
reload_config         = "Super+R"          # re-read this file (layout opts hot-swap;
# chord changes still need WM restart)


# Per-engine semantics:
#   tile/grid/dwindle → swap with neighbour at (row±1, col)/(row, col±1)
#   scrolling         → swap columns (L/R) or intra-column reorder (U/D)
#   monocle           → reorder in z-stack
#   game-mode         → reorder within the non-anchor band (anchor immovable;
#                       use rules.toml to change which window is the anchor)
#   float             → no-op (use rules.toml / future nudge_floating_*)
move_window_left      = "Super+Shift+Left"   # default
move_window_right     = "Super+Shift+Right"  # default
move_window_up        = "Super+Shift+Up"     # default
move_window_down      = "Super+Shift+Down"   # default


# Layout-switch sugar: resolves through [layout.slots] above.
set_layout_primary    = "Super+T"          # → tile
set_layout_secondary  = "Super+F"          # → scrolling
set_layout_tertiary   = "Super+M"          # → monocle
set_layout_quaternary = "Super+G"          # → grid

# --- Workspaces (niri-style, ext-workspace-v1) ---
# Workspaces are exclusive: a window lives on exactly one workspace and exactly
# one workspace is active per output. These verbs drive RiverDelta's native
# ext-workspace-v1 implementation (focus = activate+commit; "send to workspace"
# = river_window_v1.set_workspace, with no hide/show emulation). Indices are
# 1-based positions in the per-output ordered workspace list.
#
# Focus / switch the active workspace.
focus_workspace_1        = "Super+1"
focus_workspace_2        = "Super+2"
focus_workspace_3        = "Super+3"
focus_workspace_4        = "Super+4"
focus_workspace_5        = "Super+5"
focus_workspace_6        = "Super+6"
focus_workspace_7        = "Super+7"
focus_workspace_8        = "Super+8"
focus_workspace_9        = "Super+9"

# Send the focused window to a workspace (niri move-window-to-workspace).
move_to_workspace_1      = "Super+Shift+1"
move_to_workspace_2      = "Super+Shift+2"
move_to_workspace_3      = "Super+Shift+3"
move_to_workspace_4      = "Super+Shift+4"
move_to_workspace_5      = "Super+Shift+5"
move_to_workspace_6      = "Super+Shift+6"
move_to_workspace_7      = "Super+Shift+7"
move_to_workspace_8      = "Super+Shift+8"
move_to_workspace_9      = "Super+Shift+9"

# Directional switching / moving + back-and-forth.
focus_workspace_up       = "Super+Bracketleft"        # previous workspace in the list
focus_workspace_down     = "Super+Bracketright"       # next workspace in the list
focus_previous_workspace = "Super+grave"                   # back-and-forth (the ` key)
move_to_workspace_up     = "Super+Shift+Bracketleft"
move_to_workspace_down   = "Super+Shift+Bracketright"

# Per-output focus / move (relative to the focused output, no wrap).
focus_output_left        = "Super+Comma"
focus_output_right       = "Super+Period"
move_to_output_left      = "Super+Shift+Comma"
move_to_output_right     = "Super+Shift+Period"
#
# (move_workspace_up / move_workspace_down — reorder — are accepted verbs but
#  have no ext-workspace-v1 wire representation and are no-ops.)
#
# The following chords are FREE in the exclusive workspace model. Bind them to
# anything you like, e.g. under [keybinds.custom]:
#   Super+0, Super+Shift+0
#   Super+Ctrl+1..9
#   Super+Shift+Ctrl+1..9

# --- Window state ops (Phase B1e) ---
# Fullscreen / Maximize / Floating / Minimize / Scratchpad. Each toggle
# remembers the prior state so a second press round-trips. Only ONE
# fullscreen window per output is allowed (toggling another auto-restores
# the prior). Minimized windows are excluded from layout + focus cycle.
toggle_fullscreen     = "Super+Shift+F"        # default
toggle_maximize       = "Super+Shift+M"        # default
toggle_floating       = "Super+Shift+Space"    # default
toggle_minimize       = "Super+N"              # default — hide from layout
unminimize_last       = "Super+Shift+N"        # default — restore most-recent minimized
toggle_scratchpad     = "Super+Backslash"      # default — summon/dismiss "default" pad
send_to_scratchpad    = "Super+Shift+Backslash" # default — park focused in "default" pad

# --- Pointer ---
# Hold-to-untrap: while this chord is held down any active pointer constraint
# (mouse "trap" from games etc.) is released; on release the trap re-engages.
untrap_pointer        = "Super+grave"          # no compiled-in default

# Examples of the array form and explicit unbind:
#   cycle_focus = ["Super+Tab", "Alt+Tab"]
#   close_focused = []                      # disables Super+Q entirely


# -----------------------------------------------------------------------------
# Free-form custom chords. Key = chord string, value = action verb.
#
# Action verbs:
#   spawn:<argv>            — fork/exec via /bin/sh -c (detached)
#   set_layout:<id-or-slot> — switch active layout; <id> ∈ tile|monocle|grid|
#                             float|scrolling, or a [layout.slots] name
#   builtin:<action_name>   — invoke a built-in by canonical name
# -----------------------------------------------------------------------------
[keybinds.custom]
"Super+E"            = "spawn:nemo"
"Super+Shift+S"      = "spawn:grim -g \"$(slurp)\" - | wl-copy"
"Super+B"            = "spawn:zen-browser"
"XF86AudioRaiseVolume"  = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume"  = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute"         = "spawn:wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute"      = "spawn:wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86MonBrightnessUp"   = "spawn:brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn:brightnessctl set 5%-"
"XF86AudioPlay"         = "spawn:playerctl play-pause"
"XF86AudioNext"         = "spawn:playerctl next"
"XF86AudioPrev"         = "spawn:playerctl previous"

# Direct layout switches (bypassing slots).
# NOTE: Super+1..9 are reserved by the workspace bindings above (focus_workspace_1..9).
# Use the [layout.slots]-based set_layout_primary/secondary/... built-ins
# (Super+T/F/M/G) instead, or pick non-conflicting chords. Examples:
# "Super+Alt+T"        = "set_layout:tile"
# "Super+Alt+S"        = "set_layout:scrolling"
# "Super+Alt+M"        = "set_layout:monocle"
# "Super+Alt+G"        = "set_layout:grid"
# "Super+Alt+F"        = "set_layout:float"

# Re-route a built-in onto an extra chord:
"Alt+F4"             = "builtin:close_focused"

# Named scratchpads use a "verb:arg" suffix on the builtin: form. The
# pad name is created on first use; multiple pads can coexist.
# "Super+grave"        = "builtin:toggle_scratchpad_named:term"
# "Super+Shift+grave"  = "builtin:send_to_scratchpad_named:term"


# -----------------------------------------------------------------------------
# Window-state behaviour (Phase B1e). Controls fullscreen / maximize / float /
# minimize / scratchpad semantics. All keys are optional — defaults shown.
# -----------------------------------------------------------------------------
[state]
# When toggling fullscreen, also hide layer-shell layers above 'bottom'
# (the bar / notifications). NOTE: the layer-shell hide path is wired in
# Phase B1f; until then this flag is parsed but has no effect.
fullscreen_hides_bar = true

# Maximize ignores layer-shell exclusive zones (i.e. covers the bar).
# false → cover usable_area only (the conventional behaviour).
maximize_full_output = false


# -----------------------------------------------------------------------------
# Scratchpad geometry + spawn-on-empty policy.
# -----------------------------------------------------------------------------
[scratchpad]
# Behaviour when toggle_scratchpad fires on an empty pad:
#   "manual" — no-op; the pad is filled only via send_to_scratchpad
#   "spawn"  — run the configured [scratchpad.spawn.<name>] command and
#              claim its first window on manage_start
on_empty    = "manual"

# Geometry of a summoned scratchpad window, as fractions of the output's
# usable area. Anchor is one of: "center", "top", "bottom".
width_frac  = 0.6
height_frac = 0.5
anchor      = "center"

# pad-name → shell command. Run when on_empty = "spawn" and the pad is empty.
[scratchpad.spawn]
# term  = "ghostty --class=aqueous-scratch-term"
# notes = "obsidian"



# NOTE: Noctalia (the bar / SNI tray host) is NOT launched here. It is shipped
# as a systemd user unit (noctalia.service, WantedBy=graphical-session.target,
# Before=xdg-desktop-autostart.target) so its StatusNotifierWatcher comes up
# before any autostart tray app — otherwise tray icons fail to populate. See
# packaging/noctalia.service.

# Idle → lock only (swaylock-effects). No screen blank, no suspend on idle.
# Uses the same effects-enabled swaylock command as the lock_screen action.
[[exec]]
name    = "swayidle"
command = "swayidle -w timeout 300 'swaylock -f --screenshots --clock --indicator --effect-blur 7x5 --effect-vignette 0.5:0.5 --fade-in 0.2 --ring-color bb00cc --key-hover-color ee00ee --line-color 00000000 --inside-color 00000088 --separator-color 00000000'"
when    = "startup"
once    = true               # don't relaunch on --reload → avoids duplicate daemons
restart = true               # respawn (with backoff) if it dies
log     = "/tmp/swayidle.log"

#[[exec]]
#name    = "xwayland-satellite"
#command = "xwayland-satellite :0"
#when    = "startup"
#restart = true
#log     = "/tmp/xwayland-satellite.log"
#env     = { DISPLAY = ":0" }

#[[exec]]
#name    = "ghostty"
#command = "ghostty"
#when    = "startup"


[rules]
# Optional. Absolute path or ~-prefixed. Overrides the XDG search above.
path = "~/.config/aqueous/rules.toml"
