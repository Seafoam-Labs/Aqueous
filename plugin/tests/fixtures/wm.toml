# fixture comment must survive
[blur]
enabled = true # keep inline
radius = 10
passes = 4

[opacity]
enabled = false
value = 0.9

[actions]
screenshot = "grim -g \"$(slurp)\" - | wl-copy"

[keybinds]
spawn_terminal = ["Super+Return", "Super+T"]
reload_rules = "Super+Shift+R"

[keybinds.custom]
"Super+E" = "spawn:nemo"
"XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

[[output]]
name = "DP-1"
mode = "2560x1440@144"
scale = 1.0
position = [0, 0]
transform = "normal"

[[output]]
name = "HDMI-A-1"
mode = "1920x1080@60"
position = [2560, 0]
transform = "normal"

[[workspace]]
workspace = 2
layout = "scrolling"
